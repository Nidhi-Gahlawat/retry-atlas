# yaml-language-server: $schema=../schemas/retry-policy.schema.json
schemaVersion: 1.1.0
id: auth-invalid-credentials
title: Invalid credentials
summary: Do not repeat a request with credentials the server has rejected as invalid.
domain: authentication
classification: permanent
signals:
  httpStatuses: [401, 403]
  errorCodes: [invalid_client, insufficient_scope]
diagnosis:
  meaning: The server does not accept the presented identity or its permissions for this operation.
  commonCauses:
    - The client ID, secret, API key, or signature is incorrect.
    - The credential lacks the scope or role required by the endpoint.
    - The credential belongs to a different environment, tenant, or audience.
  checks:
    - Inspect the authentication error code and challenge instead of relying on status alone.
    - Compare the configured audience, issuer, scopes, and environment with the endpoint.
    - Confirm the credential source without logging the secret itself.
resolution:
  owner: caller
  immediate:
    - Stop retrying and surface the authentication or authorization failure.
    - Correct the credential or obtain the required permission before sending a new request.
  longTerm:
    - Validate credential audience and scopes during deployment or startup.
    - Separate expired-token handling from invalid-credential handling.
decision:
  retry: "no"
  retrySameRequest: false
  rationale: Waiting does not correct invalid credentials or missing authorization.
  prerequisites:
    - Correct the credential, client configuration, or granted scope before making a new request.
safety:
  idempotency: not_required
  duplicateSideEffectRisk: none
  retryAmplificationRisk: high
  circuitBreaker: not_needed
  guidance:
    - Surface an authentication or authorization failure instead of consuming a retry budget.
telemetry: [auth_error_code, credential_source, request_outcome]
tags: [auth, oauth, credentials, http-401, http-403]
aliases: [bad credentials, invalid client, insufficient scope]
references:
  - title: RFC 6750, Section 3.1 - Error Codes
    url: https://www.rfc-editor.org/rfc/rfc6750#section-3.1
