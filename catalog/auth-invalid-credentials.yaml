# yaml-language-server: $schema=../schemas/retry-policy.schema.json
schemaVersion: 1.0.0
id: auth-invalid-credentials
title: Invalid credentials
summary: Do not repeat a request with credentials the server has rejected as invalid.
domain: authentication
classification: permanent
signals:
  httpStatuses: [401, 403]
  errorCodes: [invalid_client, insufficient_scope]
decision:
  retry: "no"
  retrySameRequest: false
  rationale: Waiting does not correct invalid credentials or missing authorization.
  prerequisites:
    - Correct the credential, client configuration, or granted scope before making a new request.
safety:
  idempotency: not_required
  duplicateSideEffectRisk: none
  retryAmplificationRisk: high
  circuitBreaker: not_needed
  guidance:
    - Surface an authentication or authorization failure instead of consuming a retry budget.
telemetry: [auth_error_code, credential_source, request_outcome]
tags: [auth, oauth, credentials, http-401, http-403]
aliases: [bad credentials, invalid client, insufficient scope]
references:
  - title: RFC 6750, Section 3.1 - Error Codes
    url: https://www.rfc-editor.org/rfc/rfc6750#section-3.1
