# yaml-language-server: $schema=../schemas/retry-policy.schema.json
schemaVersion: 1.1.0
id: network-connect-timeout
title: Network connection timeout
summary: A bounded retry may succeed when a connection could not be established transiently.
domain: network
classification: transient
signals:
  errorCodes: [ETIMEDOUT, connect_timeout]
diagnosis:
  meaning: A network connection was not established before the connection timeout expired.
  commonCauses:
    - The destination is unreachable or silently dropping connection attempts.
    - A firewall, proxy, or load balancer is delaying or discarding traffic.
    - The endpoint is overloaded and cannot accept connections promptly.
  checks:
    - Confirm the timeout phase is connection establishment rather than response reading.
    - Check the resolved address, destination port, route, and proxy configuration.
    - Compare failures across endpoints or availability zones.
resolution:
  owner: shared
  immediate:
    - Try another healthy endpoint with bounded jittered backoff when available.
    - Stop when the caller deadline or retry budget is exhausted.
  longTerm:
    - Correct routing or firewall policy and restore endpoint capacity.
    - Monitor connection latency separately from request latency.
decision:
  retry: conditional
  retrySameRequest: true
  rationale: A short network or endpoint availability event may clear before another attempt.
  prerequisites:
    - Ensure the timeout occurred while establishing the connection, not while awaiting a response.
strategy:
  mechanism: exponential_backoff
  maxRetries: 2
  requiresCallerDeadline: true
  jitter: full
  baseDelayMs: 100
  maxDelayMs: 2000
safety:
  idempotency: operation_dependent
  duplicateSideEffectRisk: low
  retryAmplificationRisk: medium
  circuitBreaker: consider
  guidance:
    - Include connection setup in the end-to-end deadline.
    - Do not stack application retries on top of unknown SDK retries.
telemetry: [timeout_phase, endpoint, retry_attempt, retry_delay_ms]
tags: [network, connect, timeout, backoff]
aliases: [connect timeout, connection timed out]
references:
  - title: AWS Builders' Library - Timeouts, retries, and backoff with jitter
    url: https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/
