# yaml-language-server: $schema=../schemas/retry-policy.schema.json
schemaVersion: 1.1.0
id: network-connection-reset
title: Network connection reset
summary: Determine whether the operation may have reached the server before replaying it.
domain: network
classification: ambiguous_outcome
signals:
  errorCodes: [ECONNRESET, EPIPE]
diagnosis:
  meaning: One side closed an established connection unexpectedly while data was being exchanged.
  commonCauses:
    - The peer process restarted, crashed, or intentionally closed an idle connection.
    - A proxy or load balancer removed the connection.
    - The client wrote to a connection that the peer had already closed.
  checks:
    - Record whether the reset happened before, during, or after request transmission.
    - Compare bytes sent with server-side request or operation IDs.
    - Check peer restarts, connection-age limits, and intermediary timeout logs.
resolution:
  owner: shared
  immediate:
    - Discard the closed connection and establish a new one.
    - Reconcile ambiguous mutations before replaying them.
  longTerm:
    - Align keep-alive and idle timeout settings across clients and intermediaries.
    - Use operation IDs and idempotency controls where resets can hide completed work.
decision:
  retry: conditional
  retrySameRequest: false
  rationale: A reset can happen before sending the request or after the server has performed work.
  prerequisites:
    - Establish the failure phase and make the operation replay-safe before retrying.
strategy:
  mechanism: exponential_backoff
  maxRetries: 2
  requiresCallerDeadline: true
  jitter: full
  baseDelayMs: 100
  maxDelayMs: 2000
safety:
  idempotency: required
  duplicateSideEffectRisk: unknown
  retryAmplificationRisk: medium
  circuitBreaker: consider
  reconciliation: Use a stable operation ID to discover whether an interrupted mutation completed.
  guidance:
    - Reconnect before retrying; never reuse a reset connection.
telemetry: [failure_phase, bytes_sent, operation_id, retry_outcome]
tags: [network, connection-reset, ambiguous-outcome, idempotency]
aliases: [connection reset, broken pipe]
references:
  - title: RFC 9110, Section 9.2.2 - Idempotent Methods
    url: https://www.rfc-editor.org/rfc/rfc9110#section-9.2.2
