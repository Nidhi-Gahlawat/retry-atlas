# yaml-language-server: $schema=../schemas/retry-policy.schema.json
schemaVersion: 1.1.0
id: network-dns-temporary-failure
title: Temporary DNS resolution failure
summary: Retry a temporary resolver failure with bounded backoff and jitter.
domain: network
classification: transient
signals:
  errorCodes: [EAI_AGAIN, SERVFAIL]
diagnosis:
  meaning: DNS could not produce an answer because the resolution process failed temporarily.
  commonCauses:
    - The configured resolver is unavailable or overloaded.
    - An authoritative server failed or timed out.
    - A DNSSEC or upstream dependency failure prevented a valid answer.
  checks:
    - Capture the DNS response code and resolver used for the failed lookup.
    - Compare results through another approved resolver or from another network location.
    - Distinguish SERVFAIL or EAI_AGAIN from a cacheable NXDOMAIN response.
resolution:
  owner: operations
  immediate:
    - Retry resolution with bounded jitter while preserving normal DNS caching.
    - Use another configured resolver only when the environment supports failover.
  longTerm:
    - Restore resolver and authoritative-server availability.
    - Monitor resolution latency, response codes, and cache effectiveness.
decision:
  retry: conditional
  retrySameRequest: true
  rationale: A resolver or authoritative server may recover from a temporary failure.
  prerequisites:
    - Confirm the resolver classified the failure as temporary rather than name-not-found.
strategy:
  mechanism: exponential_backoff
  maxRetries: 2
  requiresCallerDeadline: true
  jitter: full
  baseDelayMs: 100
  maxDelayMs: 2000
safety:
  idempotency: operation_dependent
  duplicateSideEffectRisk: low
  retryAmplificationRisk: medium
  circuitBreaker: consider
  guidance:
    - Preserve DNS caching behavior and avoid synchronized resolver traffic.
telemetry: [dns_response_code, resolver, retry_attempt, resolution_outcome]
tags: [network, dns, temporary, backoff]
aliases: [temporary dns failure, dns servfail]
references:
  - title: RFC 2308 - Negative Caching of DNS Queries
    url: https://www.rfc-editor.org/rfc/rfc2308
